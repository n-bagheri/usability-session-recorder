<!doctype html><html lang="en"><meta charset="utf-8"><title>Recorder independent calibration board</title>
<style>body{margin:0;background:#eee;color:#222;font:18px sans-serif}h1,p{text-align:center;margin:8px}button{position:fixed;width:54px;height:54px;transform:translate(-50%,-50%);border:2px solid #111;border-radius:50%;background:#fff;cursor:crosshair}button:before,button:after{content:'';position:absolute;background:black}button:before{left:50%;top:0;width:1px;height:100%}button:after{top:50%;left:0;height:1px;width:100%}button.hit{background:#ffb000}#a{left:10%;top:10%}#b{left:90%;top:10%}#c{left:50%;top:50%}#d{left:10%;top:90%}#e{left:90%;top:90%}</style>
<h1>Independent calibration board</h1><p>This is NOT MapGen. Record the same Chrome viewport and OBS transform.</p><p>Click five crosshair centers. A color toggle supplies an identifiable saved-video onset.</p>
<button id="a" aria-label="top left"></button><button id="b" aria-label="top right"></button><button id="c" aria-label="center"></button><button id="d" aria-label="bottom left"></button><button id="e" aria-label="bottom right"></button>
<script>document.querySelectorAll('button').forEach(b=>b.addEventListener('mousedown',()=>b.classList.toggle('hit')))</script></html>
